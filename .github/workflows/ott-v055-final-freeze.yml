name: ott-v055-final-freeze-retrieve

on:
  workflow_dispatch: {}
  push:
    branches: [ott/v0.5.5-final-freeze]
    paths:
      - '.github/workflows/ott-v055-final-freeze.yml'

permissions:
  contents: read
  packages: read

env:
  RUNTIME_IMAGE: ghcr.io/slowomir33-arch/cae-ott-v055-runtime
  EXPECTED_DIGEST: sha256:1f9fad0bb1f8d65282ff237e0538e47a4e940e472fee7e915ec9c74fffe265b8
  EXPECTED_FP_JSON_SHA256: 8ab74b5d7bb737275daf9cb4fb13edfef21cacb9a5f3b6a20c5b0ad637a317dd
  EXPECTED_FP_ROOT: 166068659b03c450b9ba2425f324bd4cfb2338a3784ee3c6fa764f0a8f256271
  EXPECTED_PIP_FREEZE_SHA256: 0f9bfbf13cca0f5d58df1892c3c63e8834a592ebb74ecda2c5f08414bb77d147

jobs:
  retrieve:
    name: Job B - independent pull-by-digest
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Runner identity
        run: |
          echo "JOB_B_RUNNER=${{ runner.name }} os=${{ runner.os }} arch=${{ runner.arch }} ImageVersion=${ImageVersion:-UNKNOWN}"
          echo "SCIENTIFIC_CHALLENGE_RUN=NO"
          echo "RUN_AUTHORIZATION=NOT_ISSUED"

      - name: GHCR login (read)
        run: |
          set -euo pipefail
          TOKEN="${{ secrets.GHCR_PULL_TOKEN }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi
          echo "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull runtime BY DIGEST on fresh runner
        run: |
          set -euo pipefail
          echo "PULLING=$RUNTIME_IMAGE@$EXPECTED_DIGEST"
          docker pull "$RUNTIME_IMAGE@$EXPECTED_DIGEST"

      - name: Verify immutable digest identity
        run: |
          set -euo pipefail
          PULLED_REF=$(docker inspect --format '{{ index .RepoDigests 0 }}' "$RUNTIME_IMAGE@$EXPECTED_DIGEST")
          PULLED_DIGEST="${PULLED_REF##*@}"
          echo "PUSHED_DIGEST=$EXPECTED_DIGEST"
          echo "PULLED_DIGEST=$PULLED_DIGEST"
          if [ "$PULLED_DIGEST" != "$EXPECTED_DIGEST" ]; then
            echo "DIGEST_MISMATCH" >&2
            exit 1
          fi
          echo "DIGEST_IDENTITY=EXACT_MATCH"

      - name: Write in-image verification script
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ott_retrieve_verify.py" <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path

          def run(cmd):
              print("+", " ".join(cmd), flush=True)
              subprocess.check_call(cmd)

          print("===== IMPORTS =====")
          subprocess.check_call([sys.executable, "-c", "import causal_abstraction, tracr; print('IMPORTS=PASS')"])

          print("===== BRIDGES =====")
          lib = Path("/opt/ott/sources/CAE/systems/10_cpu_6502_libs")
          for name in ("libisa6502.so", "libgate6502.so", "libtransistor6502.so"):
              p = lib / name
              assert p.is_file() and os.access(p, os.X_OK), p
          print("BRIDGES=3/3")

          print("===== SOURCE HEADS =====")
          print(Path("/opt/ott/fingerprint/source-heads.txt").read_text())
          pins = {
              "CAE": "9164499c60ebe5ced32f0005009fc4e72aca77ca",
              "tracr": "9ce2b8c82b6ba10e62e86cf6f390e7536d4fd2cd",
              "lilotane": "0a58c299c7d85034661f795dfe7b10ad64f547d3",
              "pandaPIparser": "95bbe291c5bdb9fb517c1ad55f5136d45450c644",
          }
          for name, sha in pins.items():
              got = subprocess.check_output(["git", "-C", f"/opt/ott/sources/{name}", "rev-parse", "HEAD"], text=True).strip()
              assert got == sha, (name, got, sha)

          print("===== LILOTANE =====")
          binp = Path("/opt/ott/sources/lilotane/build/lilotane")
          assert binp.is_file() and os.access(binp, os.X_OK)
          ev = Path("/opt/ott/fingerprint/lilotane-gcc12-include-limits-optional-evidence.txt").read_text()
          assert "include limits" in ev and "include optional" in ev
          subprocess.run([str(binp), "--help"], check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          print("LILOTANE_BIN=OK")

          print("===== PIP CHECK =====")
          subprocess.run([sys.executable, "-m", "pip", "check"], check=False)

          print("===== FINGERPRINT =====")
          root = Path("/opt/ott/fingerprint")
          records = []
          for p in sorted(x for x in root.rglob("*") if x.is_file() and x.name != "runtime_fingerprint.json"):
              records.append({"path": str(p.relative_to(root)), "sha256": hashlib.sha256(p.read_bytes()).hexdigest(), "size": p.stat().st_size})
          payload = {"files": records}
          canon = json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()
          payload["root_sha256"] = hashlib.sha256(canon).hexdigest()
          out = (json.dumps(payload, indent=2) + "\n").encode()
          js = hashlib.sha256(out).hexdigest()
          pip = hashlib.sha256((root / "pip-freeze.txt").read_bytes()).hexdigest()
          print("FP_JSON_SHA256", js)
          print("FP_ROOT", payload["root_sha256"])
          print("PIP_FREEZE_SHA256", pip)
          assert js == os.environ["EXPECTED_FP_JSON_SHA256"], (js, os.environ["EXPECTED_FP_JSON_SHA256"])
          assert payload["root_sha256"] == os.environ["EXPECTED_FP_ROOT"], (payload["root_sha256"], os.environ["EXPECTED_FP_ROOT"])
          assert pip == os.environ["EXPECTED_PIP_FREEZE_SHA256"], (pip, os.environ["EXPECTED_PIP_FREEZE_SHA256"])
          print("RETRIEVED_RUNTIME_FINGERPRINT=accepted_v0.5.5_identity")

          print("===== CAE =====")
          subprocess.check_call([sys.executable, "-m", "pytest", "-q", "test", "--tb=no"], cwd="/opt/ott/sources/CAE")
          print("SCIENTIFIC_CHALLENGE_RUN=NO")
          print("RUN_AUTHORIZATION=NOT_ISSUED")
          PY
          # strip the YAML-leading indent inside the generated file
          python3 -c "from pathlib import Path; p=Path('$RUNNER_TEMP/ott_retrieve_verify.py'); t=p.read_text(); p.write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in t.splitlines())+'\n')"

      - name: Post-retrieval execution on retrieved image
        run: |
          set -euo pipefail
          docker run --rm \
            -e EXPECTED_FP_JSON_SHA256 \
            -e EXPECTED_FP_ROOT \
            -e EXPECTED_PIP_FREEZE_SHA256 \
            -v "$RUNNER_TEMP/ott_retrieve_verify.py:/tmp/ott_retrieve_verify.py:ro" \
            "$RUNTIME_IMAGE@$EXPECTED_DIGEST" \
            python /tmp/ott_retrieve_verify.py

      - name: Persistence verdict
        run: |
          echo "PUSHED_DIGEST=$EXPECTED_DIGEST"
          echo "PULLED_DIGEST=$EXPECTED_DIGEST"
          echo "DIGEST_IDENTITY=EXACT_MATCH"
          echo "PERSISTED_IMMUTABLE_RUNTIME = PASS"
          echo "SCIENTIFIC_CHALLENGE_RUN = NO"
          echo "RUN_AUTHORIZATION = NOT ISSUED"
